# .github/workflows/touchstone.yml
# Touchstone —— 顾问式评审 + 质量门禁（对外只发一个总闸）。
# 链路：gitleaks(前置密钥扫) → touchstone(评审+风险，不拦截) → 末尾 Post gate 步内联发总闸。
# 注：verify_plan/verify_execute/gate/auto_merge 四个 vars 门控 job 已移除——org 从未设
# VERIFY_ENABLED/AUTONOMY_ENABLED，每个 PR 恒 4 条 skipped 占位；需要重启整链时 git revert 本提交。
name: Touchstone

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  # 按 PR 号而非 head.sha 分组：同 PR 快速连推时，新轮自动取消旧 SHA 的在途轮——
  # 否则两轮并发跑，旧轮可能在新轮之后回贴过期评论（轮序错乱）。取消掉的旧轮
  # 无副作用：回贴/产物尚未发生，lineage 按内容指纹记账不受缺轮影响。
  group: touchstone-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  # actions:write 下沉到 touchstone job（写 actions 缓存用）——见该 job 的 permissions 块。
  # fork PR 受 GitHub 防缓存投毒限制仍只读（不写）→ 该步退化为"每次重建"=今天的速度，
  # import 兜底检查保证不崩、日志可观测是否命中。

jobs:
  # ---- 前置：gitleaks 密钥/敏感信息扫描（SEC-001 确定性门禁的高召回补位）----
  # 产出 check-run "gitleaks"（手动建，名字精确匹配 checks.yaml relay 的 source_check）。
  # 方案 3（同工作流 needs）：touchstone 等其完成 → relay 读结论折进总闸，消跨工作流时序的"未完成"假 failure。
  # 安全：gitleaks 只读扫描（不执行 PR 代码），pull_request_target 下 checkout PR head 无注入面。
  # 为何不用 gitleaks-action@v2：它不支持 pull_request_target 事件（"The event is not yet supported"
  # 硬限制），在本工作流触发器下恒 error → relay fail-closed → 总闸恒失败、阻塞所有 PR。
  # 改直接跑 gitleaks CLI + 手动建 check-run（pull_request_target 下可用，保留同工作流 needs: 时序保证）。
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write          # 手动建 gitleaks check-run（relay 按名读结论折进总闸）
    steps:
      # checkout 钉到具体 SHA（=v4.4.0，2026-07-20 起的 v4 tip）：allow-unsafe-pr-checkout 是
      # v4.4.0 新增输入，浮动 @v4 下未来大版本漂移或本地缓存旧版会静默忽略该输入（只打 warning）
      # → fork PR 仍死在 checkout。该 SHA 正是 PR #186 上实际发出"Refusing…"拒绝的版本，实证支持。
      # ① 受信 base checkout：只为取 .gitleaks.toml（扫描配置源，见下方扫描步注释）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: trusted-config          # base 受信，无需 unsafe 放行
          persist-credentials: false
      # ② fork head checkout：被扫对象
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}   # 扫 PR 代码（非 base）
          fetch-depth: 0       # 完整历史——commit-range 扫描需 base..head 的提交都在
          persist-credentials: false
          # fork PR + pull_request_target：新版 actions/checkout（Node24 时代补丁）默认拒绝 checkout
          # fork 代码（防 pwn request），须显式放行，否则 PR #186 式死在 checkout 步、扫描从未跑。
          # 本 job 安全：gitleaks 只读扫描、不执行 PR 代码（上方注释），token 亦 persist-credentials:false 不落盘。
          allow-unsafe-pr-checkout: true
      - name: 安装 gitleaks
        run: |
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks 扫描
        id: scan
        continue-on-error: true    # gitleaks 退出 1=发现泄露——要让 job 继续到建 check-run 步
        run: |
          # 防 fork 压制扫描结果（round-3 review item 1，gitleaks 8.30.1 本地实测复现三种豁免面）：
          # ① --config 指受信 base 的配置——fork 改自己树里的 .gitleaks.toml（如清空规则）不再生效
          #    （旧写法 --config .gitleaks.toml 读的是 fork 工作树，可被 PR 作者换掉）
          # ② rm 源根 .gitleaksignore——gitleaks 认源根该文件的 fingerprint（commit:file:rule）豁免，
          #    且实测 --gitleaks-ignore-path 无法覆盖源根文件；fork 作者可算出自己泄漏的指纹自我豁免。
          #    本仓 base 无 .gitleaksignore（若有需要走受信 base 版本，勿用 fork 的）
          # ③ --ignore-gitleaks-allow——fork 在泄漏行旁加 "gitleaks:allow" 注释不再豁免（纵深防御）
          rm -f .gitleaksignore
          # 扫 PR 提交范围（base..head）——只拦本 PR 引入的泄露，不翻历史旧账
          gitleaks detect --source . \
            --config trusted-config/.gitleaks.toml \
            --ignore-gitleaks-allow \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact --report-format json --report-path /tmp/gitleaks.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: 发布 gitleaks check-run
        uses: actions/github-script@v7
        with:
          script: |
            const code = Number('${{ steps.scan.outputs.code }}');
            // 0=干净(success), 1=发现泄露(failure), 其他=工具错误(neutral)
            const conclusion = code === 0 ? 'success' : code === 1 ? 'failure' : 'neutral';
            const fs = require('fs');
            let leakCount = 0;
            try {
              leakCount = JSON.parse(fs.readFileSync('/tmp/gitleaks.json', 'utf8')).length;
            } catch {}                                  // 干净时 gitleaks 不生成 report 文件
            const summary = conclusion === 'success'
              ? '✅ 未发现泄露'
              : conclusion === 'failure'
                ? `❌ 发现 ${leakCount} 处疑似泄露（零路径排除——所有文件都扫）`
                : `⚠️ gitleaks 工具错误（exit ${code}）`;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'gitleaks',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion,
              output: { title: `gitleaks · ${conclusion}`, summary }
            });

  # ---- 判断层：评审（advisory，不拦截；总闸由本 job 末尾 Post gate 步内联发布）----
  # needs gitleaks + !cancelled()：gitleaks 完成（无论成败）后才跑——Post gate 的 checks relay 读
  # gitleaks check-run 折进总闸。gitleaks 失败（发现泄露）时 touchstone 仍跑（!cancelled 不被上游
  # 失败挡），relay 读到 failure → 总闸 failure，统一出口。gitleaks 不会跳过（无 if），故无 skipped 态需兜。
  touchstone:
    needs: [gitleaks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest          # 自托管 runner 见下方网络注记
    permissions:
      contents: read
      pull-requests: write      # orchestrator 发评审评论
      checks: write             # SKIP_GATE=true 下 orchestrator 不自发闸；总闸由本 job 末尾 Post gate 步发
      actions: read             # 只读 .pragent-venv 缓存。写缓存已移至 warm-pragent-cache.yml（可信触发器）：
                                # GitHub 2026-06-26 起 pull_request_target 属低信任触发器，对默认分支缓存【只读】，
                                # save 永远失败（"token has no writable scopes"）且被 continue-on-error 静默——
                                # 上游报告问题一：36 次运行缓存零命中、每轮白重建 venv ~57s。
    env:
      # pr-agent 版本单一来源：下方 cache key 与 pip install 同引此变量，升版只改这一行（两处自动同步刷新）。
      PRA_VERSION: "0.44.0"
    steps:
      # fail-loud 守卫（round-2 review item 2）：verify/gate/auto_merge 链移除后，若有人再设
      # vars.VERIFY_ENABLED/AUTONOMY_ENABLED=true，这两个 vars 会【静默 no-op】——期望的 verify
      # 深检不再发生且无人察觉。本步把静默 no-op 转成显式红：设了即 fail，提示先 git revert
      # 移除提交（重启整链）或清除 vars。不设（现状）→ 步骤 skipped，零行为变化。
      # round-3 item 3：守卫红不再连坐评审链——下方 Run review / Post gate 等步按 outcome != 'failure'
      # 门控，守卫触发时留下【唯一且归因清晰】的信号（红 job + ::error 注解），不误导性地发
      # "未产出结果" 总闸、也不对无辜 PR 发半截评审。
      - name: "Guard: removed verify/autonomy chain must not be requested"
        id: guard
        if: ${{ vars.VERIFY_ENABLED == 'true' || vars.AUTONOMY_ENABLED == 'true' }}
        run: |
          echo "::error::VERIFY_ENABLED/AUTONOMY_ENABLED 为 true，但 verify/gate/auto_merge 链已移除（见文件头注释）——vars 现为静默 no-op。重启整链：git revert 移除提交；或清除这两个 vars。"
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
      # 审计 #48：guard_context 的守卫事实须按【PR head】源码解析——本 job 主 checkout 是
      # base ref（经验库防投毒等按受信基线读），拿 base 文件对 PR diff 的 target 行号会错位
      # （改动行在 base 里根本不存在/位置不同），守卫摘要系统性失真。head 单独 checkout 到
      # 子目录，只经 TOUCHSTONE_GUARD_REPO_DIR 喂给 guard_context（_parse 内解析），
      # 评审链其余读路径（经验库/seeds/契约）仍走受信 base，边界不变。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head-src
          fetch-depth: 1
      - uses: actions/setup-python@v5
        id: py
        with:
          # 钉 3.13：pr-agent 的原生依赖（tiktoken 经 PyO3 0.22.6）暂不支持 3.14，会源码编译失败。
          # 且必须与 warm-pragent-cache.yml 钉同一版本——两工作流的 venv 缓存键须逐字段一致（见下方 key）。
          python-version: "3.13"
          # pip 下载缓存（~/.cache/pip）：键由 setup-python 按 pyproject.toml/requirements.txt 哈希自动算。
          # 一处生效帮两处：(1) 下方 pip install -e . 命中本地 wheel 免下载（10s→~3s，并消除网络抖动尾部）；
          # (2) venv 缓存 miss 时 .pragent-venv/bin/pip install pr-agent 复用同一下载缓存（~60s→~35s）。
          # warm-pragent-cache.yml 也开了 cache: pip → warm 跑过的 wheel 进默认分支缓存、PR 侧 restore 即用。
          cache: pip
      - name: Resolve Python minor (venv cache key stability)
        id: pyminor
        # 缓存键只用 minor（3.13）不用补丁号（3.13.14）：同 minor 的 cp313 ABI 稳定，编译 wheel
        # （tiktoken/tokenizers 等）跨补丁号可复用——避免 runner 镜像升补丁号时全员 miss + 重建波
        # （warm 的 schedule 是周一，否则升补丁到下周一之间每个 PR 白重建 ~35s）。import pr_agent 兜底
        # 检查防任何罕见 ABI 问题（失败即下方 Set up 步重建），正确性不失。键段须与 warm 逐字一致。
        run: echo "minor=$(echo '${{ steps.py.outputs.python-version }}' | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
      - name: Install deps
        run: pip install -e .
        # 自托管 runner 若经代理访问公网：按需设置/清理 *_PROXY；可选用私有/就近 PyPI 镜像加速 pip install
      - name: Restore PR-Agent venv (cache)
        # 缓存装好的 .pragent-venv（pr-agent + 130+ 依赖），省掉每次 ~64s 的 venv 创建 + pip install
        # （实测每轮 GHA 日志：venv 步骤稳定 ~64s，是 LLM 调用之外最大固定开销）。
        # 键含 OS + arch + Python【minor】(steps.pyminor.outputs.minor，如 3.13) + pr-agent 版本 + 锁哈希：
        #   - minor 而非补丁号：同 minor 的 cp313 ABI 稳定，编译 wheel 跨补丁号可复用——runner 镜像升补丁号
        #     不再致全员 miss（旧键含补丁号时，升补丁→下个周一 warm 之间每 PR 白重建 ~35s）。
        #   - 罕见 ABI 漂移由下方 Set up 步的 import pr_agent 兜底（失败即重建），正确性不失。
        # 本工作流只 restore（pull_request_target 属低信任触发器，GitHub 2026-06-26 起对默认分支缓存只读，
        # save 永久失败）；save 由 warm-pragent-cache.yml 在可信触发器（push/schedule/workflow_dispatch）下做。
        id: pragent-venv
        uses: actions/cache/restore@v4
        with:
          path: .pragent-venv
          key: pragent-venv-${{ runner.os }}-${{ runner.arch }}-py${{ steps.pyminor.outputs.minor }}-pragent${{ env.PRA_VERSION }}-lock${{ hashFiles('pragent-constraints.txt') }}-v2
          # 键含 runner.arch：runner.os 对 x64/arm64 同为 Linux，venv 带编译产物（tiktoken 等），跨架构命中不可用。
          # 集成方注意：hashFiles 相对 workspace 根解析——若把 touchstone checkout 到子目录，请按实际路径调整
          # （如 hashFiles('.touchstone-src/pragent-constraints.txt')），否则该段静默变空、锁文件变更不再使缓存失效。
      - name: Set up PR-Agent (independent venv)
        # PR-Agent 是评审引擎（Apache-2.0 pip 包），按"不进本仓依赖"原则装在独立 venv。
        # continue-on-error：装失败不让整个评审 job 崩（那样连评审都不发）；orchestrator 会优雅降级、
        # 在 PR 评审里显式标注"AI 评审未运行"（防静默故障，见 README）。
        #
        # 缓存命中且 import 可用 → 直接复用（省 ~60s）；否则（首次 / 缓存失效 / runner 镜像内部变更致
        # venv 绝对路径失效）重建。import 兜底检查防"命中缓存却跑崩"的静默故障——venv 含绝对路径，
        # 即便 key 匹配，镜像内部工具链变更仍可能让缓存"在"但"不可导入"；此检查确保可用才复用。
        # 钉 pr-agent 版本：让缓存键精确、可复现。版本号统一取上方 env.PRA_VERSION——升版只改那一行，
        # 本处的 pip pin 与 cache key 两处自动同步刷新（不再需要手动改两行）。
        continue-on-error: true
        run: |
          if [ -x .pragent-venv/bin/python ] && .pragent-venv/bin/python -c 'import pr_agent' 2>/dev/null; then
            echo "[pragent-venv] 缓存命中且可用，复用（跳过创建）"
          else
            echo "[pragent-venv] 缓存未命中或失效，创建中"
            rm -rf .pragent-venv
            # 三步装 venv 全部纳入守护（venv 创建 / pip 升级 / pip 装 pr-agent）：bash -eo pipefail 下
            # 任一步失败若裸写会 set -e 立即 abort、绕过下方清理 → 留 partial .pragent-venv 在盘 →
            # actions/cache post 步把它持久化成"key 命中却 import 不了"的脏条目（continue-on-error 让本步
            # 照常过、cache 照常 save）。放进 if 条件（set -e 不作用于 if/until/while 的条件命令）→ 任一失败
            # 走 else 的 rm -rf 清理，cache post 见 path 不存在→跳过 save，下次 key miss 重建干净的。
            # 评审结论不受影响：venv 没了→runner import 失败→orchestrator 优雅降级标注"AI 评审未运行"
            # （与留着破损 venv 走 import 失败→降级同路）。纯缓存卫生修复，零行为变化。
            if python -m venv .pragent-venv \
               && .pragent-venv/bin/pip install -U pip \
               && .pragent-venv/bin/pip install pr-agent==${{ env.PRA_VERSION }} -c pragent-constraints.txt; then
              echo "[pragent-venv] 安装成功"
            else
              echo "[pragent-venv] 安装失败——清理破损 venv，避免被缓存污染"
              rm -rf .pragent-venv
            fi
          fi
      - name: Run review
        id: run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY:  ${{ secrets.LLM_API_KEY }}
          LLM_MODEL:    ${{ secrets.LLM_MODEL }}      # pr_agent_runner 映射成 LiteLLM 的 openai/<model> + OPENAI_API_KEY/BASE
          # SIZE-001 体量门禁阈值经 repo variable 可调（orchestrator._max_diff_lines 读 env；空串=未设
          # 回落默认 3000、"0"=关闭）。接线修复：此前从未透传，vars.TOUCHSTONE_MAX_DIFF_LINES 是死配置。
          TOUCHSTONE_MAX_DIFF_LINES: ${{ vars.TOUCHSTONE_MAX_DIFF_LINES }}
          # LLM 上下文/输出 token 预算（部署方按模型卡填【repo variable】，非敏感值不占 secret——
          # 同 TOUCHSTONE_MAX_ROUNDS 教义。迁移期双读：variable 优先、旧 secret 兜底，部署方把值
          # 从 Secrets 挪到 Variables 后模板可平移；迁移完成后可删 `|| secrets.*` 兜底。secret 化的
          # 副作用实测有害：值如 "8192"/"131072" 会在全仓日志里把同串一律打码，排障时看不见真值）。
          # TOUCHSTONE_LLM_CONTEXT_TOKENS 是【输入侧上下文窗口】——pr-agent 的 get_max_tokens 用它作 diff
          # 裁剪预算；不接或过小（如 4096）会把改动 diff 裁空→LLM 0 建议（PR #44 真根因）。未设则 runner 回退 128000。
          TOUCHSTONE_LLM_CONTEXT_TOKENS: ${{ vars.TOUCHSTONE_LLM_CONTEXT_TOKENS || secrets.TOUCHSTONE_LLM_CONTEXT_TOKENS }}
          TOUCHSTONE_LLM_OUTPUT_TOKENS:  ${{ vars.TOUCHSTONE_LLM_OUTPUT_TOKENS || secrets.TOUCHSTONE_LLM_OUTPUT_TOKENS }}
          TOUCHSTONE_PRAGENT_CMD: ".pragent-venv/bin/python -m touchstone.pr_agent_runner"
          TOUCHSTONE_INTERACTION_LOG: "pr-agent-interaction.log"   # 完整 LLM 交互日志（artifact，评审评论里贴链接）
          TOUCHSTONE_PRAGENT_TIMEOUT: "3600"            # pr-agent 子进程超时（秒）。按慢模型实测余量定
                                                          # （glm-5.2 实测单次 360s+），improve+review 各含重试，需足够余量；可调
          TOUCHSTONE_LLM_CALL_TIMEOUT: "600"            # 单次 LLM 调用超时（秒，pr-agent ai_timeout）。【语义勘误】
                                                          # 这是 httpx per-read 超时、不是墙钟：端点持续出字节则不触发
                                                          # （生产单调用实测 1515s；滴流实验可无限续命）。流式化后该语义
                                                          # 恰好变正确：真死等 600s 必杀、持续出字不误杀。
          TOUCHSTONE_LLM_REFLECT_MODEL: "glm-4.7"       # improve 自评（第二次 LLM 调用，pr-agent 0.39 mandatory 的
                                                          # self-reflection 打分）专用模型 = config.model_reasoning，
                                                          # 【不是】fallback_models（后者是主调用失败换模清单，已清空）。
                                                          # 自评是浅任务，小模型即可，improve 健康路径耗时近乎减半。
          TOUCHSTONE_LLM_NUM_RETRIES: ${{ vars.TOUCHSTONE_LLM_NUM_RETRIES || secrets.TOUCHSTONE_LLM_NUM_RETRIES }}
                                                          # ↑ 同上：非敏感调优值走 variable（迁移期 secret 兜底）。
                                                          # tenacity 层重试次数 N。未设/空 = 默认 0 = 不重试——全量
                                                          # 183 run 实证：真实失败（超时+长生成断连）全部发生在 600s+
                                                          # 后，轮内重试救回率 0/8。快窗内抖动类失败自动 N+1（见下）。
                                                          # litellm/openai client 内层一律 0，不再参与重试。
          # TOUCHSTONE_LLM_RETRY_FAST_WINDOW: "120"     # 快窗（秒）：失败发生在此窗内且为抖动类（秒级瞬断/快速 5xx）
                                                          # 才享受 N+1；窗外一律视为系统性失败按 N（默认0）处理。0=关闭加成。
          TOUCHSTONE_LLM_STREAM: "true"                 # glm 系列（主模型+自评模型）流式调用。false 回退非流式。
          TOUCHSTONE_LLM_THINKING: ${{ vars.TOUCHSTONE_LLM_THINKING || secrets.TOUCHSTONE_LLM_THINKING }}
                                                          # 思考模式开关：disabled / enabled，未设=端点默认。注入请求体
                                                          # {"thinking":{"type":...}}（GLM 方言，litellm extra_body 透传
                                                          # 已实测）。思考型端点默认开思考时每调用先烧数千 reasoning
                                                          # token——大 diff improve 单调用 10min+ 的头号嫌疑。优先在网关
                                                          # 侧对本 key 默认关（治本）；网关不可改时配 disabled。主模型与
                                                          # 自评模型统一生效。
          TOUCHSTONE_LITELLM_VERBOSE: "false"           # 诊断开关（pr_agent_runner.py 显式调 litellm._turn_on_debug()——
                                                          # litellm 1.84 的 set_verbose 在 import 时求值，事后赋值是空操作）。
                                                          # 仅临时诊断用：DEBUG 走 stderr，会把 failure_stderr_tail 的 600 字符
                                                          # 窗口挤满、真实报错被推出——默认关闭。
          # TOUCHSTONE_LLM_PING: "false"                  # 端点已确认健康的部署可关预检 ping（默认开；fan-out 下省 2 次往返）
          TOUCHSTONE_SKIP_GATE: "true"                 # 不自发总闸：由本 job 末尾 Post gate 步统一发
          # 经验库路径：必须用 learning_loop 认的 env 名 TOUCHSTONE_EXPERIENCE（不是 STORE_PATH），
          # 否则评审侧 load_store() 读不到 learn.yml 维护的 data/experience_store.json。
          TOUCHSTONE_EXPERIENCE: "data/experience_store.json"
          TOUCHSTONE_EXPERIENCE_ENABLED: "true"
          TOUCHSTONE_EXPERIENCE_REF: "origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"  # 从受信 base ref 读经验库（防 PR 篡改工作树投毒）         # 评审路径注入开关（review_provider._experience_injection 认）
          # ── shadow 注入（冷启动破死锁：让 candidate 采 A/B with-臂数据 → graduate→active）──
          # 触发背景：run #6（07-27）TF-GRPO 蒸出 191 条 candidate，但全是 candidate、0 条 active，
          # 而 render_injection 默认只注入 active → 评审侧 0 条经验、闭环没合上。开 shadow 注入让
          # candidate 以 advisory（标灰 [shadow]、不进闸）进入评审、同时 marker 归因 shadow_types，
          # 才能采集 lift 数据、逐步 graduate 达标转 active。
          # 安全前提已满足：① step4 已接通——review_provider._experience_injection 与 orchestrator
          #   _collect_injection 读【同一】_shadow_injection_enabled()，marker 归因与实际渲染同源，
          #   不会失真（experience_store.py 早期"未接通 step4 勿开"警告现已过时）；② EXPERIENCE_REF
          #   已配 → candidate 也走受信 ref（铁律 5，review_provider.py L473-480 已拦）。
          TOUCHSTONE_SHADOW_INJECTION: ${{ vars.TOUCHSTONE_SHADOW_INJECTION || 'true' }}
          # vars. kill-switch（对齐文件既有 vars.X||default 约定，如 TOUCHSTONE_LEARNING_ENABLED）：
          # 默认 'true'（冷启动需采 A/B 数据、闭环要合上）；运维发现 shadow 注入扰乱归因、或候选池已普遍
          # active 不再需要采数时，置 repo variable TOUCHSTONE_SHADOW_INJECTION=false 即可零代码关闭（fail-safe）。
          # GHA 表达式里非空串 "false" 为真值 → 原样透传 "false" → Python 侧 _shadow_injection_enabled() 判关。
          # min_evidence=2（默认 1）：只 shadow 注入 source_prs≥2 的 candidate。当前池里有 150/191 条
          # 是单 PR 孤证（含 LLM 幻觉型 PRA-A/B/C/OK 等，均 source_prs=['116']），min_evidence=2 把这些
          # 孤证噪声挡在 shadow 外，只放 41 条有重复证据的进采数臂——降爆面、又不饿死臂（真规律会在
          # 后续 PR 复现、被再蒸馏补证据后入选）。ratio/max 仍走设计默认（0.5 / 3 每轮）。
          # 经 vars. 可调（对齐 TOUCHSTONE_SHADOW_INJECTION 的 kill-switch 约定）：池子变干净后可下调到 1
          # 扩大采数面，或上调进一步收窄。默认 '2'。
          TOUCHSTONE_SHADOW_MIN_EVIDENCE: ${{ vars.TOUCHSTONE_SHADOW_MIN_EVIDENCE || '2' }}
          # 评审健康度看板（可选，默认关）：置 true 后，每轮在本仓开/重写一个带 label 的 issue
          # 成"活"看板（本轮快照 + 滚动趋势；body 重写不发通知，仅显著事件追加评论）。
          # 经 repo variable 配（Settings → Secrets and variables → Actions → Variables，
          # 建 TOUCHSTONE_METRICS_ISSUE=true）——不设/空 = 关（默认，零行为变化），设 'true' 开。
          # 用 bare vars.（与上方 AUTONOMY_* 同 convention）：空值经 dict(os.environ) 透传给
          # orchestrator → metrics_issue.run 第一道 `!= "true"` 判 disabled（Python 拥有默认/fail-closed）。
          TOUCHSTONE_METRICS_ISSUE: ${{ vars.TOUCHSTONE_METRICS_ISSUE }}
          # TOUCHSTONE_METRICS_ISSUE_LABEL: "touchstone-metrics"   # 看板 issue 的 label（若改 vars. 须在 Python 侧处理空串，勿直接 uncomment）
          # TOUCHSTONE_METRICS_ISSUE_WINDOW: "50"                   # 滚动历史保留轮数（bounded FIFO）
          # ── 最大检视轮次（repo variable 可调，默认 9）──────────────────────────
          # loop.py:22 读 TOUCHSTONE_MAX_ROUNDS（含坏值兜底：空/非数字→9，0/负→夹 1）。此前仅
          # env 直填无生产入口——现在经 repo variable 控制（Settings → Secrets and variables →
          # Actions → Variables，建 TOUCHSTONE_MAX_ROUNDS，非敏感值用 variable 不占 secret）。
          # 非敏感 + 可被任何人读到不影响安全 → variable 而非 secret。改动即刻对下一次触发的
          # 评审生效（每轮 run 重新读 env）。注意：引擎级故障轮（LLM 调用失败等）不消耗轮次
          # 预算（loop.INFRA_FAILURE_STATUSES），本值只约束「成功执行的评审轮」上限。
          TOUCHSTONE_MAX_ROUNDS: ${{ vars.TOUCHSTONE_MAX_ROUNDS || '9' }}
          # 审计 #48：guard_context 按 PR head 源码解析（上方 pr-head-src checkout）；未设时
          # guard_context 回落调用方 repo_dir（base 主 checkout）——仅影响守卫摘要/核销注入。
          TOUCHSTONE_GUARD_REPO_DIR: "pr-head-src"
        run: python -m touchstone.orchestrator
      # 「Save PR-Agent venv」步已移除（上游报告问题一）：pull_request_target 下缓存写入被 GitHub
      # 2026-06-26 政策永久拒绝，continue-on-error 把这个永久失败伪装成瞬态黄警告。写缓存改由
      # .github/workflows/warm-pragent-cache.yml 在可信触发器（push 到默认分支 / schedule /
      # workflow_dispatch）下预热；本工作流只 restore（低信任触发器仍可读默认分支作用域缓存）。
      - name: Upload LLM interaction log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-agent-interaction
          path: pr-agent-interaction.log
          if-no-files-found: ignore
      - name: Upload findings (校准入口 + 评审可观测性)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchstone-findings
          path: touchstone-findings.json
          if-no-files-found: ignore
      - name: Upload metrics (运维可观测性：可信率/静默故障/放行率聚合)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchstone-metrics
          path: touchstone-metrics.json
          if-no-files-found: ignore
      # 总闸内联发布（P1⑥ 由"默认路径内联"收敛为唯一路径——verify/gate/auto_merge 链已整体移除）：
      # 读 Run review 写在 cwd 的 touchstone-findings.json → checks relay 聚合 gitleaks 等结论 →
      # 发对外唯一的 "touchstone/gate" check-run。findings 缺失时据 TOUCHSTONE_HEAD_SHA 发
      # "未产出结果" failure check（fail-closed，不静默）。verify-result.json 恒不存在：
      # checks._check_verify 的 except (OSError, ValueError) 归一为中性结论，不挡。
      # `!cancelled()`：被取消时不发 check（always() 含取消态，否则会对每个被取消的 run 发
      # "未产出结果" failure check，偏离旧行为）。
      # `steps.guard.outcome != 'failure'`（round-3 item 3）：守卫（vars 误设）红时不再发
      # "未产出结果" 的误导性总闸——配置错误的信号是红 job + ::error 注解本身，唯一且归因清晰。
      - name: "Post gate"
        if: ${{ always() && !cancelled() && steps.guard.outcome != 'failure' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TOUCHSTONE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_DIR: "."
        run: python -m touchstone.checks

